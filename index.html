---
layout: default
title: Blog
---
<section class="intro">
  <h1>{{ site.title }}</h1>
  <p>{{ site.tagline }}</p>
</section>

{%- if site.posts.size > 0 %}
  {% include post-list.html posts=site.posts excerpts=true %}
{%- else %}
  <p class="empty">No posts yet — add a file to <code>_posts/</code> to get started.</p>
{%- endif %}
